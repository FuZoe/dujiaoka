[program:laravel-queue]
command=php /app/artisan queue:work redis --sleep=3 --tries=3 --timeout=90
directory=/app
user=application
autostart=true
autorestart=true
startsecs=1
startretries=10
stopwaitsecs=95
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
