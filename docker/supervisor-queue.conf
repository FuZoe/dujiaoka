[program:laravel-queue]
command=php /app/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=90
directory=/app
user=application
autostart=true
autorestart=true
startsecs=1
startretries=10
stopwaitsecs=95
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:telegram-shop-interactions]
command=php /app/artisan queue:work redis --queue=telegram-interactions --sleep=1 --tries=2 --timeout=45
directory=/app
user=application
autostart=true
autorestart=true
startsecs=1
startretries=10
stopwaitsecs=50
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/storage/logs/telegram-shop-interactions.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:binance-pay-poller]
command=php /app/artisan binance-pay:poll --daemon --sleep=60
directory=/app
user=application
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/storage/logs/binance-pay-poller.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
