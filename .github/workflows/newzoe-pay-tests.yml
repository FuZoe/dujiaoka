name: NewZoe Pay Tests

on:
  push:
    branches:
      - master
    paths:
      - app/**
      - config/**
      - services/newzoe-pay/**
      - tests/**
      - .github/workflows/newzoe-pay-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newzoe-pay-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 24.x
    defaults:
      run:
        working-directory: services/newzoe-pay
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run payment regression tests
        run: npm test

  shop-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: bcmath, gd, pdo_sqlite
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run payment-window tests
        run: |
          vendor/bin/phpunit tests/Unit/NewzoePaymentWindowTest.php
          vendor/bin/phpunit tests/Unit/NewzoePaymentLifecycleTest.php
          vendor/bin/phpunit tests/Unit/PaymentAvailabilityTest.php
          vendor/bin/phpunit tests/Unit/AlipayKeyGuardTest.php
