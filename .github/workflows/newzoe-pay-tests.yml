name: NewZoe Pay Tests

on:
  push:
    branches:
      - master
    paths:
      - services/newzoe-pay/**
      - .github/workflows/newzoe-pay-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newzoe-pay-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 24.x
    defaults:
      run:
        working-directory: services/newzoe-pay
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run payment regression tests
        run: npm test
